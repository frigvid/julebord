<!DOCTYPE html>
<html lang="nb">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#070d2b" />
	<title>Julebord</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style/styles.css" />
	<link rel="stylesheet" href="style/chooser.css" />
</head>
<body>
	<div id="sky" aria-hidden="true"></div>
	<div id="stars" aria-hidden="true"></div>
	<canvas id="scenery-canvas" aria-hidden="true"></canvas>
	<canvas id="snow-back-canvas" aria-hidden="true"></canvas>
	<div id="lights" class="lights" aria-hidden="true"></div>
	<main class="page page-chooser">
		<header class="hero">
			<h1>Julebord</h1>
			<p class="tagline">Velg selskapet ditt</p>
		</header>
		<nav class="tiles" aria-label="Velg julebord">
			<a class="tile" href="he/">
				<span class="tile-inner">
					<span class="tile-name">Hammerfest Energi</span>
					<span class="tile-and">og</span>
					<span class="tile-name">Lucerna</span>
				</span>
			</a>
			<a class="tile" href="heb/">
				<span class="tile-inner">
					<span class="tile-name">HEB/Teneo</span>
				</span>
			</a>
		</nav>
	</main>
	<canvas id="snow-front-canvas" aria-hidden="true"></canvas>

	<script src="script/snow.js"></script>
	<script src="script/scenery.js"></script>
	<script src="script/chooser.js"></script>
</body>
</html>
